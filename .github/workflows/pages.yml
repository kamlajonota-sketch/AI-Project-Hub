name: Deploy AI Project Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, flags=re.I | re.S)
          assert scripts, "No inline JavaScript found"
          Path("/tmp/ai-project-hub-check.js").write_text("\n".join(scripts), encoding="utf-8")
          assert "<!doctype html>" in html.lower(), "Missing HTML doctype"
          for token in ('id="toolGrid"', 'id="addBtn"', 'id="exportBtn"', 'id="importBtn"'):
              assert token in html, f"Missing required UI element: {token}"
          print("HTML smoke checks passed")
          PY
          node --check /tmp/ai-project-hub-check.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
